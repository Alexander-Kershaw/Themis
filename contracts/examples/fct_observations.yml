dataset_name: fct_observations
primary_key: [station_id, ts]
columns:
  - name: station_id
    dtype: string
    required: true
  - name: ts
    dtype: datetime
    required: true
  - name: t2m_c
    dtype: float
    required: true
  - name: wind_ms
    dtype: float
    required: false
rules:
  uniqueness: [station_id, ts]
  not_null: [station_id, ts, t2m_c]
severity:
  uniqueness: error
  not_null: error
