[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "themis"
version = "0.1.0"
description = "Engine-agnostic data contracts + quality gates + quarantine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "polars>=0.20.0",
  "pyyaml>=6.0.1",
]

[project.scripts]
themis = "themis.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
